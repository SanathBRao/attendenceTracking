<!DOCTYPE html>
<html>
<head>
  <title>Student Attendance</title>
  <meta charset="UTF-8" />
</head>

<body>
  <h1>Mark Attendance</h1>

  <button id="connectWalletButton" onclick="connectStudent()">Connect Wallet</button>
  <p id="studentAddress"></p>

  <hr>

  <h3>Student Details</h3>
  <input id="studentName" placeholder="Student name" />
  <input id="studentEmail" placeholder="Student email" />

  <hr>

  <button id="scanQrButton" onclick="startQrScanner()">Scan QR Code</button>
  <button id="stopQrButton" onclick="stopQrScanner()" hidden>Stop Scanner</button>
  <div id="qrReader" style="width: 320px; max-width: 100%; margin-top: 12px;" hidden></div>

  <p>or enter session manually</p>
  <input id="sessionId" placeholder="Session ID from QR" />
  <button onclick="markAttendance()">Mark Attendance</button>

  <p id="status"></p>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="student.js"></script>
</body>
</html>
